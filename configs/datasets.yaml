datasets:
  target_birds:
    source: BirdCLEF+ 2026 train_audio
    geographic_focus: Pantanal, Mato Grosso do Sul, Brazil
    num_species: 20
    freeze_manifest_path: data/manifests/species_freeze.csv
    split_manifest_path: data/manifests/dataset_split.csv
    audio_directory: data/BirdClef/train_audio/
    selection_rules:
      class_name: Aves
      collection: XC
      rating_min: 3.0
      n_klip_min: 20
      n_author_min: 3
  open_set_negatives:
    types:
      type_a:
        description: Unknown birds from BirdCLEF+ 2026 not in gallery
        source: BirdCLEF+ 2026 train_audio
      type_b:
        description: Non-bird taxa from BirdCLEF+ 2026 (Amphibia, Reptilia, Mammalia, Insecta)
        source: BirdCLEF+ 2026 train_audio
      type_c:
        description: Pure background environmental noise from ITERA campus
        source: data/itera_noise/
  itera_noise:
    directory: data/itera_noise/
    manifest_path: data/manifests/itera_noise_manifest.csv
    sampling_rate: 32000
    sub_locations:
      - Embung ITERA (Aquatic / Amphibian ambient)
      - Arboretum / Kebun Raya ITERA (Forest canopy biophony)
      - Area Terbuka / Gedung Kuliah (Anthropogenic traffic/HVAC)
  domain_shift_e4:
    source: BirdCLEF+ 2026 train_soundscapes
    directory: data/BirdClef/train_soundscapes/
